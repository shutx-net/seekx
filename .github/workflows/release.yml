# バージョンタグ（v1.2.3 など）を打つと、各プラットフォーム向けのバイナリを
# ビルドして GitHub Release に添付する。
#
# ci.yml は push（main）と pull request でしか動かず、タグ push では走らない。
# 壊れたバイナリを配らないよう、この workflow 側でも同じ検証を通してからビルドする。
# 検証コマンドを増減するときは ci.yml と AGENTS.md も併せて更新すること。
name: Release

on:
  push:
    tags: ["v*"]
  # 失敗したリリースをやり直すための手動トリガー。タグを打ち直さずに済む。
  # workflow_dispatch は既定ブランチの workflow ファイルで動くため、
  # ここを直せば過去のタグに対しても直した手順で再実行できる。
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例: v0.1.0）"
        required: true

# Release の作成にはリポジトリへの書き込みが要る。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # タグ push のときは github.ref_name（タグ名）、手動実行のときは入力のタグ。
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # 手動実行でも、そのタグ時点のコードをビルドする。
          ref: ${{ inputs.tag || github.ref_name }}

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          # 配布物は最新の Go でビルドする。go.mod が宣言する下限（1.22）での
          # ビルド可否は ci.yml が pull request の時点で確認済み。
          go-version: stable
          cache: false

      # 壊れたバイナリを配らないための門番。ci.yml と同じ検証を通す。
      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt がかかっていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

      # 外部依存が無い純粋な Go なので、CGO_ENABLED=0 なら 1 ジョブで全部クロスコンパイルできる。
      # -trimpath はビルド環境の絶対パスを埋め込ませないため、-s -w はサイズを削るため。
      # version は起動ログと --version に出る（cmd/seekx/main.go）。
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            os=${target%/*}
            arch=${target#*/}
            bin=seekx
            if [ "$os" = windows ]; then
              bin=seekx.exe
            fi
            GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${bin}" ./cmd/seekx

            name="seekx_${VERSION}_${os}_${arch}"
            # 実行ビットを保つためアーカイブにする（Release から直接落とすと失われる）。
            if [ "$os" = windows ]; then
              (cd dist && zip -q "${name}.zip" "${bin}" && rm "${bin}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "${bin}" && rm "${bin}")
            fi
          done
          ls -lh dist

      - name: checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt
          cat checksums.txt

      # gh は runner に同梱されている。第三者 action を増やさないために CLI を使う。
      # タグ名は ${{ }} で run に直接展開せず env 経由で渡す（スクリプト注入を避ける）。
      #
      # Release が既にある場合はアセットを足すだけにする。GitHub の UI から Release を
      # 作るとその時点でタグも作られ、それがこの workflow を起動する。つまり
      # 「Release が先にあってタグ push が後から来る」順序が普通に起きるので、
      # gh release create 一本だと必ず衝突する（実際に v0.1.0 で踏んだ）。
      # 既存の Release のタイトルと本文は書き換えない。UI で書いた内容を尊重する。
      - name: create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION は既にあります。アセットを添付します。"
            gh release upload "$VERSION" dist/* --clobber
          else
            echo "Release $VERSION を作成します。"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              dist/*
          fi
